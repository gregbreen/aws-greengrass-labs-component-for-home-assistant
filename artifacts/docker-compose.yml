services:
  homeassistant:
    container_name: homeassistant
    image: "homeassistant/home-assistant:2026.9.3"
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    stop_grace_period: 60s
    privileged: true
    network_mode: host
